<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script>
// 桌面板只吃 nip.io 連結，但 nip.io 來源的頁面子資源會被 Chromium 的
// DNS rebinding 防護全擋（canopy 實測，2026-08-27）。解法同 canopy：
// 頁面自己第一時間跳回 127.0.0.1——必須是頁內導航，伺服器 302 會被丟給系統瀏覽器。
if (location.hostname.endsWith('.nip.io')) {
  location.replace('http://127.0.0.1:' + (location.port || '9588') + location.pathname + location.hash);
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskWire 控制台</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

</head>
